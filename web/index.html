<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grand Strategy 3D</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="hud">
    <h1>Grand Strategy 3D</h1>
    <div class="row">
      <input id="empireName" placeholder="Enter empire name" value="Auroria" />
      <select id="difficulty"><option value="normal">Normal</option><option value="hard">Hard</option></select>
      <button id="newGame">New Game</button>
      <button id="nextTurn">Next Turn</button>
    </div>
    <pre id="stats">Create a game to begin.</pre>
  </div>
  <canvas id="scene"></canvas>
  <script type="module" src="/app.js"></script>
</body>
</html>
